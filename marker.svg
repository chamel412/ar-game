<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 白背景 -->
  <rect width="400" height="400" fill="white"/>

  <!-- 外枠 -->
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="black" stroke-width="12"/>

  <!-- 左上: 塗り四角 -->
  <rect x="36" y="36" width="130" height="130" fill="black"/>
  <!-- 左上内側の白抜き -->
  <rect x="56" y="56" width="90" height="90" fill="white"/>
  <!-- 左上コアドット -->
  <rect x="76" y="76" width="50" height="50" fill="black"/>

  <!-- 右上: 枠のみ四角 (非対称) -->
  <rect x="234" y="36" width="130" height="130" fill="none" stroke="black" stroke-width="10"/>
  <rect x="254" y="56" width="90" height="90" fill="none" stroke="black" stroke-width="6"/>
  <circle cx="299" cy="101" r="20" fill="black"/>

  <!-- 左下: L字型 -->
  <rect x="36" y="234" width="80" height="130" fill="black"/>
  <rect x="36" y="314" width="130" height="50" fill="black"/>
  <!-- 左下くり抜き -->
  <rect x="56" y="254" width="40" height="60" fill="white"/>

  <!-- 右下: バツ印 + 小四角群 -->
  <line x1="234" y1="234" x2="364" y2="364" stroke="black" stroke-width="12"/>
  <line x1="364" y1="234" x2="234" y2="364" stroke="black" stroke-width="12"/>
  <rect x="262" y="262" width="76" height="76" fill="none" stroke="black" stroke-width="6"/>

  <!-- 中央: 識別パターン -->
  <circle cx="200" cy="200" r="30" fill="black"/>
  <circle cx="200" cy="200" r="16" fill="white"/>
  <circle cx="200" cy="200" r="6"  fill="black"/>

  <!-- 中央周辺のドット (非対称) -->
  <circle cx="160" cy="170" r="8" fill="black"/>
  <circle cx="240" cy="170" r="8" fill="black"/>
  <circle cx="155" cy="230" r="8" fill="black"/>
  <circle cx="240" cy="235" r="5" fill="black"/>
  <rect x="188" y="148" width="12" height="12" fill="black"/>
  <rect x="195" y="232" width="18" height="8"  fill="black"/>
</svg>
